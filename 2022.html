<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2022 개정 수학과 교육과정</title>
    <!-- 화면 캡처를 위한 html2canvas 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary-color: #0284c7;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 25px;
        }

        /* 탭 메뉴 스타일 */
        .tab-menu {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
.tab-content > h2 {
    font-size: 1rem;
}
        .tab-btn {
            padding: 10px 20px;
            background-color: #e2e8f0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: var(--primary-color);
            color: white;
        }

        .tab-content {
            display: none;
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .tab-content.active {
            display: block;
        }

        /* 모드 전환 버튼 */
        .mode-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
        }

        .mode-btn {
            padding: 8px 16px;
            background-color: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: #475569;
        }

        .mode-btn.active {
            background-color: #0f172a;
            color: white;
            border-color: #0f172a;
        }

        .memory-overview {
            display: none;
            margin-bottom: 20px;
            padding: 18px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }

        .memory-overview.active {
            display: block;
        }

        .memory-overview h3 {
            margin: 0 0 14px;
            color: var(--primary-color);
            font-size: 1.05rem;
        }

        .memory-overview-section {
            margin-top: 14px;
        }

        .memory-overview-section:first-of-type {
            margin-top: 0;
        }

        .memory-overview-section h4 {
            margin: 0 0 6px;
            font-size: 0.98rem;
            color: #334155;
        }

        .memory-overview-item {
            margin: 5px 0;
            line-height: 1.6;
        }

        .memory-overview-index {
            display: inline-block;
            min-width: 28px;
            font-weight: bold;
            color: #64748b;
        }

        .practice-section, .exam-section {
            display: none;
        }

        .practice-section.active, .exam-section.active {
            display: block;
        }

        /* 중간 분류 제목 스타일 */
        .subsection-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #000000;
            margin: 20px 0 15px 0;
            padding-bottom: 5px;
            border-bottom: 1px dashed #bae6fd;
        }

        /* 문제 박스 레이아웃 */
        .question-box {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #f1f5f9;
        }

        .question-index {
            font-size: 1.05rem;
            font-weight: bold;
            color: #334155;
            min-width: 45px;
            padding-top: 8px;
            flex-shrink: 0;
        }

        .question-body {
            flex-grow: 1;
        }

        textarea.user-input {
            width: 100%;
            height: 75px;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            resize: vertical;
            box-sizing: border-box;
            font-family: inherit;
        }

        textarea.user-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .btn-group {
            margin-top: 8px;
            display: flex;
            gap: 8px;
        }

        .submit-btn {
            background-color: var(--primary-color);
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .submit-btn:hover {
            background-color: #0284c7;
        }

        .toggle-ans-btn {
            background-color: var(--primary-color);
            color: white;
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .toggle-ans-btn:hover {
            background-color: #475569;
        }

        /* 시험 모드 하단 버튼 영역 */
        .exam-submit-area {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .exam-submit-btn {
            background-color: #10b981;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.05rem;
            flex-grow: 1;
        }

        .exam-submit-btn:hover {
            background-color: #059669;
        }

        .capture-btn {
            background-color: #6366f1;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
        }

        .capture-btn:hover {
            background-color: #4f46e5;
        }

        /* 결과 비교 영역 */
        .result-container {
            margin-top: 12px;
            display: none; /* 기본 숨김 */
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            grid-template-columns: auto 1fr;
            gap: 6px 8px;
            align-items: baseline;
        }

        .result-label {
            font-weight: bold;
            color: #64748b;
            white-space: nowrap;
        }

        .ans-label {
            padding-left: 3.5px; 
        }

        .result-text {
            word-break: break-all;
            line-height: 1.5;
        }

        .char-correct {
            color: #059669;
        }

        .char-incorrect {
            color: #dc2626;
            background-color: #fee2e2;
            text-decoration: underline;
            font-weight: bold;
        }
    </style>
</head>

                    subTitle: "<b>교구나 공학 도구를 활용하여 평가</b>할 때는 다음 사항을 고려한다",
                    questions: [
                        { index: "①", answer: "성취기준의 도달 여부를 판단하는 데 교구나 공학 도구의 사용이 효과적인 경우 이를 활용한 평가를 실시할 수 있다." },
                        { index: "②", answer: "교구나 공학 도구를 활용하여 평가할 때는 교구나 공학 도구의 기능 및 조작이 아닌 수학 내용의 탐구 과정을 평가한다." },
                    ]
                },
                                {
                    subTitle: "<b>온라인 수학 교수·학습 환경에서 평가</b>할 때는 다음 사항을 고려한다",
                    questions: [
                        { index: "①", answer: "온라인 수학 학습에서는 학생의 활동에 근거한 구체적인 자료를 사용하여 평가한다. " },
                        { index: "②", answer: "온라인 학습 플랫폼이나 학습 관리 시스템을 이용하여 학생의 수행 과정을 관찰하고 개별 맞춤형으로 환류할 수 있다." },
                        { index: "③", answer: "학생의 접속 환경 미비로 인한 불참 시 기회 부여 등에 대해 방안을 마련하고 형평성의 문제가 제기되지 않도록 사전에 안내한다." },
                    ]
                },
            ]
        },
    };

    // 화면 초기화 및 자동 렌더링
    window.addEventListener('DOMContentLoaded', () => {
        const tabMenu = document.getElementById('tabMenu');
        const container = document.getElementById('tabContentContainer');

        let isFirstTab = true;

        for (const [tabKey, tabVal] of Object.entries(studyData)) {
            // 1. 탭 버튼 생성
            const btn = document.createElement('button');
            btn.className = `tab-btn ${isFirstTab ? 'active' : ''}`;
            btn.textContent = tabVal.title;
            btn.onclick = (e) => switchTab(e, tabKey);
            tabMenu.appendChild(btn);

            // 2. 탭 컨텐츠 박스 생성
            const tabDiv = document.createElement('div');
            tabDiv.id = tabKey;
            tabDiv.className = `tab-content ${isFirstTab ? 'active' : ''}`;
            
            let html = `
                <h2>${tabVal.subtitle}</h2>
                <div class="mode-toggle">
                    <button class="mode-btn" onclick="switchMode(this, 'memory')">📖 전체 내용 보기</button>
                    <button class="mode-btn active" onclick="switchMode(this, 'practice')">✏️ 한 줄씩 암기</button>
                    <button class="mode-btn" onclick="switchMode(this, 'exam')">📋 전체 시험보기</button>
                </div>
                <div class="memory-overview"></div>
                <div class="practice-section active"></div>
                <div class="exam-section"></div>
            `;
            tabDiv.innerHTML = html;

            const memoryOverview = tabDiv.querySelector('.memory-overview');
            memoryOverview.innerHTML = `<h3>${tabVal.title} </h3>`;

            tabVal.subsections.forEach(sub => {
                const section = document.createElement('div');
                section.className = 'memory-overview-section';
                section.innerHTML = `<h4>${sub.subTitle}</h4>`;

                sub.questions.forEach(q => {
                    const item = document.createElement('div');
                    item.className = 'memory-overview-item';
                    item.innerHTML = `<span class="memory-overview-index">${q.index}</span>${q.answer}`;
                    section.appendChild(item);
                });

                memoryOverview.appendChild(section);
            });

            const practiceSec = tabDiv.querySelector('.practice-section');
            const examSec = tabDiv.querySelector('.exam-section');

            // 3. 서브섹션 및 문항 데이터 자동 순회 및 주입
            tabVal.subsections.forEach(sub => {
                const pSubWrapper = document.createElement('div');
                pSubWrapper.innerHTML = `<div class="subsection-title">● ${sub.subTitle}</div>`;
                
                const eSubWrapper = document.createElement('div');
                eSubWrapper.innerHTML = `<div class="subsection-title">● ${sub.subTitle}</div>`;

                sub.questions.forEach(q => {
                    pSubWrapper.appendChild(createQuestionBox(q.index, q.answer, 'practice'));
                    eSubWrapper.appendChild(createQuestionBox(q.index, q.answer, 'exam'));
                });

                practiceSec.appendChild(pSubWrapper);
                examSec.appendChild(eSubWrapper);
            });

            // 시험 모드 하단 버튼 추가
            const examSubmitArea = document.createElement('div');
            examSubmitArea.className = 'exam-submit-area';
            examSubmitArea.innerHTML = `
                <button class="exam-submit-btn" onclick="evaluateExam(this)">전체 시험 제출 및 채점하기</button>
                <button class="capture-btn" onclick="captureScreen()">📸 결과 캡처 저장</button>
            `;
            examSec.appendChild(examSubmitArea);

            container.appendChild(tabDiv);
            isFirstTab = false;
        }
    });

    // 공통 문제 박스 HTML 생성기
    function createQuestionBox(index, answer, mode) {
        const box = document.createElement('div');
        box.className = 'question-box';
        box.setAttribute('data-answer', answer);

        let actionHtml = '';
        if (mode === 'practice') {
            actionHtml = `
                <div class="btn-group">
                    <button class="submit-btn" onclick="evaluateAnswer(this)">제출 및 채점</button>
                    <button class="toggle-ans-btn" onclick="toggleAnswer(this)">정답 보기</button>
                </div>
            `;
        }

        box.innerHTML = `
            <div class="question-index">${index}</div>
            <div class="question-body">
                <textarea class="user-input" placeholder="여기에 암기한 내용을 타이핑하세요..."></textarea>
                ${actionHtml}
                <div class="result-container">
                    <div class="result-label ans-label">정답:</div>
                    <div class="result-text ans-view"></div>
                    <div class="result-label">내 작성:</div>
                    <div class="result-text user-view"></div>
                </div>
            </div>
        `;
        return box;
    }

    // 탭 전환
    function switchTab(evt, tabId) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

        document.getElementById(tabId).classList.add('active');
        evt.currentTarget.classList.add('active');
    }

    // 모드 전환
    function switchMode(btn, mode) {
        const tabContent = btn.closest('.tab-content');
        tabContent.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const memoryOverview = tabContent.querySelector('.memory-overview');
        const practiceSec = tabContent.querySelector('.practice-section');
        const examSec = tabContent.querySelector('.exam-section');

        memoryOverview.classList.toggle('active', mode === 'memory');
        practiceSec.classList.toggle('active', mode === 'practice');
        examSec.classList.toggle('active', mode === 'exam');
    }

    // 텍스트 비교 알고리즘 (띄어쓰기 및 가운데점 예외 처리)
    function compareText(correctAnswer, userInput) {
        const normalize = (str) => str.replace(/[\s⋅·,]+/g, '');
        let cleanCorrect = normalize(correctAnswer);
        let userHtml = '';
        let userIdx = 0;

        for (let i = 0; i < userInput.length; i++) {
            let char = userInput[i];
            
            if (/\s/.test(char)) {
                userHtml += char;
                continue;
            }

            if (char === '⋅' || char === '·' || char === ',') {
                userHtml += `<span class="char-correct">${char}</span>`;
                continue;
            }

            if (userIdx < cleanCorrect.length) {
                while (userIdx < cleanCorrect.length && (cleanCorrect[userIdx] === '⋅' || cleanCorrect[userIdx] === '·' || cleanCorrect[userIdx] === ',')) {
                    userIdx++;
                }

                if (userIdx < cleanCorrect.length && char === cleanCorrect[userIdx]) {
                    userHtml += `<span class="char-correct">${char}</span>`;
                } else {
                    userHtml += `<span class="char-incorrect">${char}</span>`;
                }
                userIdx++;
            } else {
                userHtml += `<span class="char-incorrect">${char}</span>`;
            }
        }
        return userHtml;
    }

    // 한 줄 채점
    function evaluateAnswer(btn) {
        const questionBox = btn.closest('.question-box');
        const correctAnswer = questionBox.getAttribute('data-answer');
        const userInput = questionBox.querySelector('.user-input').value;
        const resultContainer = questionBox.querySelector('.result-container');
        const ansView = questionBox.querySelector('.ans-view');
        const userView = questionBox.querySelector('.user-view');
        const toggleBtn = questionBox.querySelector('.toggle-ans-btn');

        resultContainer.style.display = 'grid';
        ansView.textContent = correctAnswer;
        userView.innerHTML = compareText(correctAnswer, userInput);
        
        // 채점 완료 후 정답 숨기기 버튼 노출 및 상태 초기화
        toggleBtn.style.display = 'inline-block';
        toggleBtn.textContent = '정답 숨기기';
        toggleBtn.style.backgroundColor = '#64748b';
    }

    // 결과 칸 숨기기/보기 토글 기능
    function toggleAnswer(btn) {
        const questionBox = btn.closest('.question-box');
        const resultContainer = questionBox.querySelector('.result-container');
        const ansView = questionBox.querySelector('.ans-view');
        
        if (resultContainer.style.display === 'grid') {
            resultContainer.style.display = 'none';
            btn.textContent = '정답 보기';
            btn.style.backgroundColor = '#0284c7';
        } else {
            ansView.textContent = questionBox.getAttribute('data-answer');
            resultContainer.style.display = 'grid';
            btn.textContent = '정답 숨기기';
            btn.style.backgroundColor = '#64748b';
        }
    }

    // 전체 시험 채점
    function evaluateExam(btn) {
        const examSection = btn.closest('.exam-section');
        const questionBoxes = examSection.querySelectorAll('.question-box');

        questionBoxes.forEach(box => {
            const correctAnswer = box.getAttribute('data-answer');
            const userInput = box.querySelector('.user-input').value;
            const resultContainer = box.querySelector('.result-container');
            const ansView = box.querySelector('.ans-view');
            const userView = box.querySelector('.user-view');

            resultContainer.style.display = 'grid';
            ansView.textContent = correctAnswer;
            userView.innerHTML = compareText(correctAnswer, userInput);
        });
    }

    // 화면 캡처 저장
    function captureScreen() {
        const targetElement = document.getElementById('captureArea');
        html2canvas(targetElement, { scale: 2 }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'memorize_result.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    }
</script>
