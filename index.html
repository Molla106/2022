<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2022 개정 수학과 교육과정</title>
    <style>
        :root {
            --primary-color: #0284c7;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            color: var(--text-color);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
        }

        .shell {
            max-width: 950px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 25px;
            text-align: center;
        }

        .eyebrow {
            display: none;
        }

        h1 {
            margin: 0 0 10px;
            color: var(--primary-color);
            font-size: 2rem;
        }

        .intro {
            margin: 0;
            color: #475569;
            line-height: 1.5;
        }

        .choices {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .choice {
            display: flex;
            min-height: 245px;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px;
            color: var(--text-color);
            text-decoration: none;
            background-color: var(--card-bg);
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: box-shadow 0.2s, border-color 0.2s;
        }

        .choice:hover {
            border-color: var(--primary-color);
            box-shadow: 0 6px 12px -1px rgba(0, 0, 0, 0.14);
        }

        .number {
            display: inline-grid;
            width: 36px;
            height: 36px;
            place-items: center;
            color: white;
            font-weight: bold;
            background: var(--primary-color);
            border-radius: 8px;
        }

        .choice h2 {
            margin: 22px 0 10px;
            color: var(--text-color);
            font-size: 1.35rem;
        }

        .choice p {
            margin: 0;
            color: #475569;
            line-height: 1.6;
        }

        .launch {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 22px;
            color: var(--primary-color);
            font-weight: bold;
        }

        footer {
            margin-top: 20px;
            color: #64748b;
            font-size: 0.85rem;
            text-align: center;
        }

        @media (max-width: 680px) {
            body {
                padding: 20px 12px 35px;
            }

            .header {
                margin-bottom: 20px;
            }

            .intro {
                font-size: 0.95rem;
            }

            .choices {
                grid-template-columns: 1fr;
            }

            .choice {
                min-height: 220px;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <main class="shell">
        <header class="header">
            <div>
                <p class="eyebrow">MATHEMATICS · 2022 REVISED CURRICULUM</p>
                <h1>2022 개정 수학과 교육과정 암기</h1>
            </div>
        </header>

        <section class="choices" aria-label="학습 자료 선택">
            <a class="choice" href="2022.html">
                <div>
                    <span class="number">01</span>
                    <h2>2022 개정 교육과정</h2>
                    <p>수학과 목표, 교수·학습의 방향과 방법, 평가의 방향과 방법</p>
                </div>
                <span class="launch">교육과정 열기 <span aria-hidden="true">→</span></span>
            </a>

            <a class="choice criteria" href="성취기준.html">
                <div>
                    <span class="number">02</span>
                    <h2>성취기준</h2>
                    <p>성취기준, 성취기준 해설, 적용 시 고려사항</p>
                </div>
                <span class="launch">성취기준 열기 <span aria-hidden="true">→</span></span>
            </a>
        </section>
    </main>
</body>
</html>
