<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2022 개정 수학과 교육과정</title>
    <style>
        :root {
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-main: #1d1d1f;
            --text-secondary: #86868b;
            --accent-color: #0071e3;
            --accent-hover: #0077ed;
            --border-color: rgba(0, 0, 0, 0.08);
            --shadow-sm: 0 4px 20px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro KR", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: center;
        }

        .shell {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 40px;
            text-align: center;
        }

        .eyebrow {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 12px;
            color: var(--text-main);
            font-size: 2.25rem;
            font-weight: 700;
            letter-spacing: -0.015em;
        }

        .intro {
            margin: 0;
            color: var(--text-secondary);
            font-size: 1.05rem;
        }

        .choices {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 24px;
        }

        .choice {
            display: flex;
            min-height: 240px;
            flex-direction: column;
            justify-content: space-between;
            padding: 32px;
            color: var(--text-main);
            text-decoration: none;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .choice:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: rgba(0, 113, 227, 0.3);
        }

        .number {
            display: inline-flex;
            width: 32px;
            height: 32px;
            align-items: center;
            justify-content: center;
            color: var(--accent-color);
            font-weight: 600;
            font-size: 0.85rem;
            background: rgba(0, 113, 227, 0.08);
            border-radius: 50%;
        }

        .choice h2 {
            margin: 20px 0 8px;
            color: var(--text-main);
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .choice p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .launch {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 24px;
            color: var(--accent-color);
            font-weight: 600;
            font-size: 0.95rem;
            transition: gap 0.2s ease;
        }

        .choice:hover .launch {
            gap: 10px;
        }

        @media (max-width: 680px) {
            body {
                padding: 24px 16px;
                justify-content: flex-start;
            }

            .header {
                margin-bottom: 28px;
            }

            h1 {
                font-size: 1.75rem;
            }

            .choices {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .choice {
                min-height: auto;
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <main class="shell">
        <header class="header">
            <div>
                <span class="eyebrow">MATHEMATICS · 2022 REVISED CURRICULUM</span>
                <h1>2022 개정 수학과 교육과정 암기</h1>
                <p class="intro">학습할 영역을 선택하세요.</p>
            </div>
        </header>

        <section class="choices" aria-label="학습 자료 선택">
            <a class="choice" href="2022.html">
                <div>
                    <span class="number">1</span>
                    <h2>2022 개정 교육과정</h2>
                    <p>수학과 목표, 교수·학습의 방향과 방법, 평가의 방향과 방법</p>
                </div>
                <span class="launch">교육과정 열기 <span aria-hidden="true">&rarr;</span></span>
            </a>

            <a class="choice criteria" href="성취기준.html">
                <div>
                    <span class="number">2</span>
                    <h2>성취기준</h2>
                    <p>성취기준, 성취기준 해설, 적용 시 고려사항</p>
                </div>
                <span class="launch">성취기준 열기 <span aria-hidden="true">&rarr;</span></span>
            </a>
        </section>
    </main>
</body>
</html>
